# Merge this table into ~/.codex/config.toml or a trusted project's
# .codex/config.toml. Replace /absolute/path/to/codex-colab with your checkout.
[mcp_servers.colab]
command = "uv"
args = ["run", "--directory", "/absolute/path/to/codex-colab", "codex-colab"]
startup_timeout_sec = 30
tool_timeout_sec = 180
required = true
default_tools_approval_mode = "writes"

